name: "CI macOS DMG Check"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build macOS DMG
        run: npm run desktop:build:mac

      - name: Verify DMG integrity
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find dist/electron -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "${DMG_PATH}"
          hdiutil verify "${DMG_PATH}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: listenos-macos-dmg-${{ github.run_number }}
          path: dist/electron/*.dmg
          if-no-files-found: error
