name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            platform: windows-latest
            buildScript: desktop:build:windows
          - id: macos
            platform: macos-latest
            buildScript: desktop:build:mac
          - id: linux
            platform: ubuntu-22.04
            buildScript: desktop:build:linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfuse2 libxdo-dev

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Configure updater URL
        shell: pwsh
        env:
          R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:R2_PUBLIC_BASE_URL)) {
            throw "Missing secret CLOUDFLARE_R2_PUBLIC_BASE_URL"
          }
          node scripts/set-updater-endpoint.mjs $env:R2_PUBLIC_BASE_URL

      - name: Build Electron app
        run: npm run ${{ matrix.buildScript }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.id }}
          path: |
            dist/electron/*.exe
            dist/electron/*.blockmap
            dist/electron/*.dmg
            dist/electron/*.zip
            dist/electron/*.AppImage
            dist/electron/latest*.yml
          if-no-files-found: error

  publish-r2:
    runs-on: ubuntu-latest
    needs: build-electron
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: dist/publish
          merge-multiple: true

      - name: Upload release files to Cloudflare R2
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          aws s3 cp dist/publish/ "s3://${R2_BUCKET}/releases/v${VERSION}/" --recursive --endpoint-url "${R2_ENDPOINT}" --no-progress
          aws s3 cp dist/publish/ "s3://${R2_BUCKET}/" --recursive --endpoint-url "${R2_ENDPOINT}" --no-progress
